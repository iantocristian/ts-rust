# ADR 0017: few, vetted crates. Apache-2.0-compatible licenses only, no duplicate
# versions, no known advisories, crates.io only. Run through `cargo xtask run deny`.

[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "wasm32-unknown-unknown",
]
all-features = true

[advisories]
# The advisory database stays at cargo-deny's default, $CARGO_HOME/advisory-dbs, outside the
# repository: a git-managed cache inside target/ is pruned by CI caching, after which cargo-deny
# fails to load it and resets the enclosing repository's tracked files (reproduced 2026-09-06).
yanked = "deny"
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
]
confidence-threshold = 0.9
exceptions = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
