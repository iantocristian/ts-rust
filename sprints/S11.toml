ref = "0019"
required = true
done_when = ["adr.0019.status == Accepted"]

[[item]]
id = "S11-2"
title = "Callback filesystem operations (readFile, fileExists, directoryExists, getAccessibleEntries, realpath) over the connection, with cancellation and callback progress"
kind = "task"
required = true
done_when = ["run.testhost.parity == 1"]

[[item]]
