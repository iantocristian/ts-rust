# Phase 0, sprint 11. Not an input to the Phase 0 gate (S12); runs in parallel with S08 to S10.
# Producer to register: testhost (cases = the transport fixture list).
#   run.testhost.parity    callback filesystem operations, cancellation and callback progress match the fixtures
#   run.testhost.controls  test-only initialization, options and plugin controls round-trip
id = "S11"
title = "Test-host transport prototype"
goal = "The test-host protocol is designed and reviewed, and callback filesystem and plugin operations are prototyped over the connection with case-insensitive, symlink and mapper fixtures as transport contract tests; semantic fourslash assertions stay in Phase 5."
exit = [
  "sprint.S06.done == 1",
  "adr.0019.status == Accepted",
  "run.testhost.parity == 1",
  "run.testhost.controls == true",
]

[[item]]
id = "S11-1"
title = "Test-host protocol design note and ADR 0019 reviewed by the owner"
