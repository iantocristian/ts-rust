# Phase 0, sprint 9. The e3 producer completes: every criterion under [E3] in status/experiments.toml.
# Scenario rows in docs/design/ownership.md and docs/design/symbols.md name their criteria.
id = "S09"
title = "Ownership and registry harness"
goal = "Production arena, resolver and lease components run under minimal program, snapshot, checker-pool and API-registry owners; checker results and AST, builder caches and emit tables, request scratch, the generation gate and panic retirement behave as the design notes specify; E3 passes, including Miri and AddressSanitizer."
exit = [
  "sprint.S08.done == 1",
  "exp.E3.pass == 1",
  "run.clippy.clean == true",
]

[[item]]
id = "S09-1"
title = "Retained checker results and checker-created AST nodes keep exact checker identity and dependencies after lease release or idle-slot replacement"
kind = "task"
required = true
done_when = ["exp.E3.checker_result_retention.pass == 1", "exp.E3.checker_ast_retention.pass == 1"]

[[item]]
id = "S09-2"
title = "Builder caches and persistent emit side tables retain every arena dependency across generations"
kind = "task"
required = true
done_when = ["exp.E3.builder_cache_retention.pass == 1"]

[[item]]
id = "S09-3"
title = "Request-scoped scratch for API printing and insertion formatting"
kind = "task"
required = true
done_when = ["exp.E3.api_scratch_disposal.pass == 1"]

[[item]]
id = "S09-4"
title = "Checker pool, snapshots and API registry under the generation gate (ADR 0012); panic retirement; forced retirement-versus-publication interleavings"
kind = "task"
required = true
done_when = ["exp.E3.shared_pool_panic_retirement.pass == 1", "exp.E3.release_boundaries.pass == 1"]

[[item]]
id = "S09-5"
title = "Every scenario under Miri and AddressSanitizer; owner and allocation counters return to baseline after each final drop"
kind = "task"
required = true
done_when = ["exp.E3.miri.pass == 1", "exp.E3.address_sanitizer.pass == 1", "exp.E3.owners_return_to_baseline.pass == 1", "exp.E3.allocations_return_to_baseline.pass == 1"]
