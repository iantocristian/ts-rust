# Phase 0, sprint 2. Producers: workspace, fmt, clippy, deny, selftest (status/runs.toml).
# The CI item is informational: runs on GitHub are not ledger evidence.
id = "S02"
title = "Toolchain, lints, dependency policy, CI"
goal = "The workspace builds on a pinned stable toolchain with formatting, pedantic clippy and cargo-deny gates and the tracker's self-tests registered as producers, and a status workflow runs on macOS and Linux."
exit = [
  "sprint.S01.done == 1",
  "run.workspace.build == true",
  "run.fmt.clean == true",
  "run.clippy.clean == true",
  "run.deny.clean == true",
  "run.selftest.pass == true",
]

[[item]]
id = "S02-1"
title = "Pinned stable toolchain, workspace lint configuration and release profile per ADR 0016"
kind = "task"
required = true
done_when = ["run.fmt.clean == true", "run.clippy.clean == true", "run.workspace.build == true"]

[[item]]
id = "S02-2"
title = "cargo-deny policy per ADR 0017: license allow-list, no duplicate versions, no advisories, crates.io only"
kind = "task"
required = true
done_when = ["run.deny.clean == true"]

[[item]]
id = "S02-3"
title = "Tracker self-tests (xtask and scripts) registered as a producer"
kind = "task"
required = true
done_when = ["run.selftest.pass == true"]

[[item]]
id = "S02-4"
title = "Status workflow on macOS and Linux: validate provenance, check the committed views, rerun producers, check S01, publish views and evidence as artifacts (verified on GitHub, not in the ledger)"
kind = "task"
required = false
done_when = []
