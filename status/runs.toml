# Commands emit one JSON object to stdout: {"metrics": { ... }}.
# The runner binds successful executions to command, inputs, target, configuration
# and repository provenance. Failed or stale runs cannot pass gates.
# E3 measures S04 arena and S06 AST storage; E4 leaves and E1 codec criteria
# remain scoped measurements, not completion of future experiments.

[workspace]
command = ["python3", "scripts/tracking-bootstrap.py", "workspace"]
inputs = ["Cargo.toml", "Cargo.lock"]
sources = ["crates/**", "Cargo.*", ".cargo/**", "rust-toolchain*", "xtask/**", "scripts/tracking-bootstrap.py"]
target = "host"
config = "debug"

[oracle]
command = ["python3", "scripts/tracking-bootstrap.py", "oracle"]
inputs = ["data/upstream.json", ".gitmodules"]
sources = ["upstream", "scripts/tracking-bootstrap.py", "xtask/**"]
target = "host"
config = "release"

# Check producers (S02). A false metric is a measured failure; a missing tool is a failed run.
# `cargo xtask run` confirms capture, not the metric's value. CI must also enforce
# these booleans with `cargo xtask check-metrics`, independently of sprint gates.
[fmt]
command = ["python3", "scripts/checks.py", "fmt"]
inputs = ["rustfmt.toml"]
sources = ["crates/**", "xtask/**", "Cargo.*", "rust-toolchain*", "rustfmt.toml", "scripts/checks.py"]
target = "host"
config = "cargo fmt --all --check"

[clippy]
command = ["python3", "scripts/checks.py", "clippy"]
inputs = ["Cargo.toml", "Cargo.lock"]
sources = ["crates/**", "xtask/**", "Cargo.*", ".cargo/**", "rust-toolchain*", "clippy.toml", "scripts/checks.py"]
target = "host"
config = "debug; all targets and features; -D warnings"

[deny]
command = ["python3", "scripts/checks.py", "deny"]
inputs = ["deny.toml", "Cargo.lock"]
sources = ["crates/**", "xtask/**", "Cargo.*", "deny.toml", "scripts/checks.py"]
target = "host"
config = "advisories, licenses, bans, sources"

[selftest]
command = ["python3", "scripts/checks.py", "selftest"]
inputs = ["Cargo.toml", "Cargo.lock"]
sources = ["xtask/**", "scripts/**", "Cargo.*", "rust-toolchain*", "data/**"]
target = "host"
config = "debug"

[e3]
command = ["python3", "scripts/s04.py", "e3"]
inputs = ["data/s04/toolchains.toml", "docs/design/ownership.md", "docs/design/symbols.md", "docs/adr/0012-panics--recovery-and-generation-retirement.md"]
cases = "data/s04/e3-cases.json"
sources = ["crates/ts_arena/**", "crates/ts_ast/**", "crates/ts_core/**", "crates/ts_diagnostics/**", "crates/ts_jsstring/**", "Cargo.*", ".cargo/**", "rust-toolchain*", "xtask/**", "scripts/s04.py", "scripts/s04_ownership.py", "scripts/s06_ownership.py", "data/s06/ownership-cases.json", "scripts/s04_common.py", "scripts/s04_runtime.py"]
target = "host"
config = "S04 arena contracts and exact S06 AST ownership test inventory; debug and release; measured per-scenario outcomes and final-drop counters; manifest-pinned nightly Miri strict provenance with production std::sync locks and AddressSanitizer with rebuilt std; native target; caller Cargo/Rustup configuration retained, optional S04_RUSTUP_HOME override"

[e4]
command = ["python3", "scripts/s04.py", "e4"]
inputs = ["data/s04/corpus.json", "data/s04/e4-probes.json", "data/s04/toolchains.toml", "data/upstream.json", ".gitmodules", "docs/design/text.md"]
cases = "data/s04/e4-cases.json"
sources = ["crates/ts_jsstring/**", "Cargo.*", ".cargo/**", "rust-toolchain*", "xtask/**", "scripts/s04.py", "scripts/s04_common.py", "scripts/s04_runtime.py", "scripts/s04_oracle/**", "scripts/tracking-bootstrap.py", "upstream"]
target = "host"
config = "S04 text leaf slice; manifest-pinned local Go toolchain and clean source pin with access-only wrappers; deterministic byte/casing/position probes; release Rust; frozen request digest and scenario counts; classified panics and exact prescribed payloads; all probes required per scenario"

[gen]
command = ["cargo", "xtask", "gen", "--verify"]
inputs = ["data/s04/toolchains.toml", "data/s03/api-special-codecs.json", "data/s06/generated-ast-scope.json", "data/upstream.json", ".gitmodules", "rustfmt.toml"]
# Regeneration reads these generated crates, not the text/arena implementations.
# Cargo still reads every workspace package manifest when launching xtask.
sources = ["crates/ts_ast/**", "crates/ts_diagnostics/**", "crates/ts_encoder/**", "crates/**/Cargo.toml", "Cargo.*", ".cargo/**", "rust-toolchain*", "xtask/**", "scripts/s03.py", "scripts/s04_common.py", "scripts/s04_runtime.py", "tools/s03/**", "data/s03/**", "upstream"]
target = "host"
config = "S03 pinned schema/extractor adapters in independent tooling worktree; Rust emitters; exhaustive managed output inventory; JSON-derived TypeScript and clean regenerated enum outputs compared byte-for-byte to pinned client; native Go wire observations, not Rust API runtime parity; exact upstream Node/npm and shared local Go pin"

[scanner]
command = ["python3", "scripts/s05.py", "scanner"]
inputs = ["data/upstream.json", ".gitmodules", "data/s04/toolchains.toml", "docs/design/text.md", "docs/S05-protocol.md"]
cases = "data/s05/cases.json"
sources = ["crates/ts_scanner/**", "crates/ts_jsnum/**", "crates/ts_core/**", "crates/ts_ast/**", "crates/ts_arena/**", "crates/ts_diagnostics/**", "crates/ts_jsstring/**", "crates/**/Cargo.toml", "Cargo.*", ".cargo/**", "rust-toolchain*", "rustfmt.toml", "xtask/**", "scripts/s05*.py", "scripts/s05_oracle/**", "scripts/s04_oracle/decode_bridge.go", "scripts/s04.py", "scripts/s04_common.py", "scripts/s04_runtime.py", "scripts/tracking-bootstrap.py", "data/s05/**", "upstream"]
target = "host"
config = "S05 scanner; clean pinned Go export with access-only bridges and local pinned toolchain; release Rust; strict streaming token/action comparisons with typed byte diagnostics; frozen physical sources in both trivia modes, explicit rescans/regexp/state/byte/numeric fixtures and complete Unicode identifier probes; snapshot parity scoped to same-scanner LIFO checkpoints; current tables and complete nonempty subsets required; future AST/encoder/checker diagnostics excluded"

[e1]
command = ["python3", "scripts/s06.py", "e1"]
inputs = ["data/upstream.json", ".gitmodules", "data/s04/toolchains.toml", "docs/design/ownership.md", "docs/design/text.md"]
cases = "data/s06/cases.json"
sources = ["crates/ts_parser/**", "crates/ts_ast/**", "crates/ts_encoder/**", "crates/ts_arena/**", "crates/ts_core/**", "crates/ts_diagnostics/**", "crates/ts_jsstring/**", "crates/ts_scanner/**", "crates/ts_jsnum/**", "crates/**/Cargo.toml", "Cargo.*", ".cargo/**", "rust-toolchain*", "rustfmt.toml", "xtask/**", "scripts/s06*.py", "scripts/s06_oracle/**", "tools/s06/**", "scripts/s05_protocol.py", "scripts/s04.py", "scripts/s04_common.py", "scripts/s04_runtime.py", "scripts/tracking-bootstrap.py", "data/s06/**", "upstream"]
target = "host"
config = "S06 direct parser and protocol-8 runtime; frozen 12,721 physical cases and 108 embedded libs, all eligible virtual units and effective option variants from clean pinned Go preprocessing; release Rust; independent stage framing and exact encoder outcomes/bytes; SourceFile state, node-index identities, constructed AST/codec/decoder, independently regenerated utility/accessor observations with exact Rust test inventory, and guarded depth fixtures gated separately; supplemental probes never add E1 rows; two frozen diagnostic-only ambiguity qualifications retain raw payloads, exactness and digests; separate measured cyclic decoder watchdog; no compiler/checker/mapper execution claim"
